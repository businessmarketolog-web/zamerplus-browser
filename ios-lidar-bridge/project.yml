name: ZamerPlusLiDARBridge
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  ZamerPlusLiDARBridge:
    type: application
    platform: iOS
    sources:
      - path: ZamerPlusLiDARBridge
    info:
      path: ZamerPlusLiDARBridge/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.zamerplus.lidarbridge
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
